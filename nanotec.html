        /* ดึงสไตล์หลักจากเว็บเดิมมาใช้ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #e5e5e5;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* พื้นหลัง Aura แบบเดิม */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(29, 78, 216, 0.08) 0%, transparent 50%);
            z-index: -1;
        }
   @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

       @keyframes glow {
    0%, 100% {
        box-shadow: 
            0 0 14px rgba(30, 64, 175, 0.25),
            0 0 28px rgba(29, 78, 216, 0.15),
            inset 0 0 12px rgba(30, 64, 175, 0.05);
    }
    50% {
        box-shadow: 
            0 0 22px rgba(30, 64, 175, 0.35),
            0 0 36px rgba(29, 78, 216, 0.2),
            inset 0 0 18px rgba(30, 64, 175, 0.08);
    }
}

        @keyframes borderGlow {
            0%, 100% {
                border-color: rgba(30, 64, 175, 0.5);
            }
            50% {
                border-color: rgba(29, 78, 216, 0.8);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes shooting-star {
            0% {
                transform: translateX(0) translateY(0) rotate(-45deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translateX(-300px) translateY(300px) rotate(-45deg);
                opacity: 0;
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
@keyframes auraPulse {
    0%, 100% {
        opacity: 0.6;
        filter: blur(16px);
    }
    50% {
        opacity: 0.9;
        filter: blur(22px);
    }
}

        .star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
            animation: twinkle 3s ease-in-out infinite;
            pointer-events: none;
            z-index: -3;
        }

        .shooting-star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: linear-gradient(90deg, white, transparent);
            border-radius: 50%;
            pointer-events: none;
            animation: shooting-star 2s ease-out infinite;
            z-index: -1;
        }

        .shooting-star::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            height: 2px;
            width: 50px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.8), transparent);
        }

  <script>
        // Create twinkling stars
        const starsContainer = document.getElementById('stars-container');
        const numStars = 100;
        
        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            starsContainer.appendChild(star);
        }
        
        // Create shooting stars
        function createShootingStar() {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.left = Math.random() * 100 + '%';
            shootingStar.style.top = Math.random() * 50 + '%';
            shootingStar.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
            starsContainer.appendChild(shootingStar);
            
            setTimeout(() => {
                shootingStar.remove();
            }, 2000);
        }
        
        // Create shooting stars at random intervals
        setInterval(() => {
            if (Math.random() > 0.6) {
                createShootingStar();
            }
        }, 1000);
        
        // Create initial shooting stars
        for (let i = 0; i < 3; i++) {
            setTimeout(createShootingStar, Math.random() * 2000);
        }
    </script>
